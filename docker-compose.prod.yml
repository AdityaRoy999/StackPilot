      - K8S_ROLLOUT_TIMEOUT_SECONDS=${K8S_ROLLOUT_TIMEOUT_SECONDS:-180}
      - KUBECONFIG_PATH=${KUBECONFIG_PATH:-/root/.kube/config}
      - KUBECONFIG=/root/.kube/config
      - STACKPILOT_AI_ENABLED=${STACKPILOT_AI_ENABLED:-true}
      - STACKPILOT_AI_SERVICE_URL=${STACKPILOT_AI_SERVICE_URL:-http://ai-service:8010}
      - STACKPILOT_AI_SERVICE_TOKEN=${STACKPILOT_AI_SERVICE_TOKEN:-}
      - STACKPILOT_AI_PROVIDER=${STACKPILOT_AI_PROVIDER:-nvidia_nim}
      - STACKPILOT_AI_MODEL=${STACKPILOT_AI_MODEL:-}
      - STACKPILOT_AI_CONFIDENCE_THRESHOLD=${STACKPILOT_AI_CONFIDENCE_THRESHOLD:-0.72}
      - STACKPILOT_AI_RATE_LIMIT_PER_MINUTE=${STACKPILOT_AI_RATE_LIMIT_PER_MINUTE:-12}
      - STACKPILOT_AI_MAX_CONTEXT_BYTES=${STACKPILOT_AI_MAX_CONTEXT_BYTES:-32000}
      - STACKPILOT_AI_SERVICE_TIMEOUT_SECONDS=${STACKPILOT_AI_SERVICE_TIMEOUT_SECONDS:-120}
      - STACKPILOT_AI_EMBEDDING_DIMENSIONS=${STACKPILOT_AI_EMBEDDING_DIMENSIONS:-384}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_NIM_MODEL=${NVIDIA_NIM_MODEL:-z-ai/glm-5.3-flash}
      - NVIDIA_NIM_FAST_MODEL=${NVIDIA_NIM_FAST_MODEL:-z-ai/glm-5.3-flash}
      - NVIDIA_NIM_THINKING_MODEL=${NVIDIA_NIM_THINKING_MODEL:-openai/gpt-oss-20b}
      - NVIDIA_NIM_BROWSER_PLANNER_MODEL=${NVIDIA_NIM_BROWSER_PLANNER_MODEL:-openai/gpt-oss-20b}
      - NVIDIA_NIM_BROWSER_FALLBACK_MODEL=${NVIDIA_NIM_BROWSER_FALLBACK_MODEL:-}
      - NVIDIA_NIM_ALLOWED_MODELS=${NVIDIA_NIM_ALLOWED_MODELS:-}
      - NVIDIA_NIM_DISCOVER_MODELS=${NVIDIA_NIM_DISCOVER_MODELS:-true}
      - NVIDIA_NIM_PROBE_MODELS=${NVIDIA_NIM_PROBE_MODELS:-true}
      - NVIDIA_NIM_EMBEDDING_MODEL=${NVIDIA_NIM_EMBEDDING_MODEL:-nvidia/llama-3.2-nv-embedqa-1b-v2}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL:-}
      - OPENAI_COMPATIBLE_API_KEY=${OPENAI_COMPATIBLE_API_KEY:-}
      - OPENAI_COMPATIBLE_MODEL=${OPENAI_COMPATIBLE_MODEL:-}
      - OPENAI_COMPATIBLE_THINKING_MODEL=${OPENAI_COMPATIBLE_THINKING_MODEL:-}
      - OPENAI_COMPATIBLE_EMBEDDING_MODEL=${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-text-embedding-3-small}
    expose:
      - "8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./uploads:/app/uploads
      - agent_workspaces:/app/agent-workspaces:ro
      - ${STACKPILOT_LOCAL_PROJECTS_DIR:-./local-projects}:/app/local-projects:ro
      - ${KUBECONFIG_HOST_PATH:-./config/kubeconfig}:/root/.kube/config:ro
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      agent-workspace-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-service:
    networks: [default, runtime]
    profiles: ["ai", "full"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *stackpilot-logging
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - BACKEND_INTERNAL_URL=http://backend:8090
      - BROWSER_SANDBOX_URL=http://browser-sandbox:9222
      - BROWSER_STREAM_HOST=browser-sandbox
      - BROWSER_STREAM_PORT=8099
      - STACKPILOT_ANDROID_WORKER_URL=${STACKPILOT_ANDROID_WORKER_URL:-}
