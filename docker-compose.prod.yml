name: stackpilot

x-stackpilot-logging: &stackpilot-logging
  driver: json-file
  options:
    max-size: ${STACKPILOT_LOG_MAX_SIZE:-10m}
    max-file: ${STACKPILOT_LOG_MAX_FILE:-5}

services:
  remote-gateway:
    build: ./remote-gateway
    container_name: stackpilot-remote-gateway
    restart: unless-stopped
    profiles: ["remote"]
    ports:
      - "127.0.0.1:8094:8094"
    depends_on:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
  remote-tunnel:
    image: cloudflare/cloudflared:2026.9.1
    container_name: stackpilot-remote-tunnel
    profiles: ["remote"]
    restart: "no"
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://remote-gateway:8094"]
    depends_on:
      - remote-gateway
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
  browser-state-init:
    profiles: ["ai", "full"]
    image: python:3.12-slim
    user: "0:0"
    command: ["python", "/usr/local/bin/init_browser_state.py"]
    volumes:
      - agent_run_state:/state
      - ./ai-service/init_browser_state.py:/usr/local/bin/init_browser_state.py:ro
    restart: "no"
  agent-workspace-init:
    image: alpine:3
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /work && chmod 700 /work"]
    volumes:
      - agent_workspaces:/work
    restart: "no"
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *stackpilot-logging
    environment:
      - ACME_EMAIL=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - STACKPILOT_CADDY_SITE_ADDRESS=${STACKPILOT_CADDY_SITE_ADDRESS:-${STACKPILOT_DOMAIN:?Set STACKPILOT_DOMAIN in .env}:${STACKPILOT_HTTPS_PORT:-9443}}
    ports:
      - "${STACKPILOT_HTTP_PORT:-8081}:80"
      - "${STACKPILOT_HTTPS_PORT:-9443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *stackpilot-logging
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *stackpilot-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The backend runs as uid 10001, but ./uploads is a host bind mount whose
  # subdirectories were historically created by a root container. Fix ownership
  # once, as root, before the backend starts — otherwise build workspaces fail
  # with "Unable to prepare generated application build workspace".
  uploads-init:
    image: alpine:3
    container_name: stackpilot-uploads-init
    user: "0:0"
    command: sh -c "mkdir -p /work/builds /work/source-artifacts && chown -R 10001:10001 /work && chmod -R u+rwX,g+rwX /work"
    volumes:
      - ./uploads:/work
    restart: "no"

  backend:
    networks: [default, runtime]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        STACKPILOT_BACKEND_BUILD_PARALLELISM: ${STACKPILOT_BACKEND_BUILD_PARALLELISM:-1}
    restart: unless-stopped
    logging: *stackpilot-logging
    environment:
      - STACKPILOT_ENV=production
      - STACKPILOT_RUNTIME_NETWORK=${STACKPILOT_RUNTIME_NETWORK:-stackpilot-runtime}
      - STACKPILOT_REQUIRE_HTTPS=${STACKPILOT_REQUIRE_HTTPS:-true}
      - STACKPILOT_TRUST_PROXY_HEADERS=true
      - STACKPILOT_API_RATE_LIMIT_PER_MINUTE=${STACKPILOT_API_RATE_LIMIT_PER_MINUTE:-240}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - STACKPILOT_REDIS_QUEUE=${STACKPILOT_REDIS_QUEUE:-stackpilot:jobs:deployment}
      - STACKPILOT_JOB_WORKERS=${STACKPILOT_JOB_WORKERS:-2}
      - STACKPILOT_JOB_MAX_ATTEMPTS=${STACKPILOT_JOB_MAX_ATTEMPTS:-3}
      - PROMETHEUS_PUBLIC_URL=${PROMETHEUS_PUBLIC_URL:-https://${STACKPILOT_DOMAIN:?Set STACKPILOT_DOMAIN in .env}:${STACKPILOT_HTTPS_PORT:-9443}/prometheus}
      - GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-https://${STACKPILOT_DOMAIN}:${STACKPILOT_HTTPS_PORT:-9443}/grafana}
      - LOKI_PUBLIC_URL=${LOKI_PUBLIC_URL:-https://${STACKPILOT_DOMAIN}:${STACKPILOT_HTTPS_PORT:-9443}/grafana/explore}
      - STACKPILOT_METRICS_BEARER_TOKEN=${STACKPILOT_METRICS_BEARER_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRY_SECONDS=${JWT_EXPIRY_SECONDS:-3600}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-https://${STACKPILOT_DOMAIN:?Set STACKPILOT_DOMAIN in .env}:${STACKPILOT_HTTPS_PORT:-9443}}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-https://${STACKPILOT_DOMAIN:?Set STACKPILOT_DOMAIN in .env}:${STACKPILOT_HTTPS_PORT:-9443}}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://${STACKPILOT_DOMAIN:?Set STACKPILOT_DOMAIN in .env}:${STACKPILOT_HTTPS_PORT:-9443}}
      - STACKPILOT_AUTH_REGISTRATION_MODE=${STACKPILOT_AUTH_REGISTRATION_MODE:-first_user_only}
      - STACKPILOT_AUTH_INVITE_CODE=${STACKPILOT_AUTH_INVITE_CODE:-}
      - ACME_EMAIL=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-StackPilot Platform}
      - BUILD_WORKSPACE_DIR=/app/uploads/builds
      - STACKPILOT_AGENT_WORKSPACE_ROOT=/app/agent-workspaces
      - STACKPILOT_AGENT_RUN_DB=/app/browser-state/browser-runs.sqlite3
      - STACKPILOT_AGENT_WORKER_NETWORK=${STACKPILOT_AGENT_WORKER_NETWORK:-false}
      - STACKPILOT_AGENT_WORKER_IMAGES=${STACKPILOT_AGENT_WORKER_IMAGES:-python:3.12-slim,node:22-bookworm-slim,eclipse-temurin:21-jdk,golang:1.24-bookworm,gcc:14-bookworm,ubuntu:24.04,debian:bookworm-slim,alpine:3.21}
      - STACKPILOT_AGENT_WORKER_MEMORY=${STACKPILOT_AGENT_WORKER_MEMORY:-512m}
      - STACKPILOT_AGENT_WORKER_FAMILIES=${STACKPILOT_AGENT_WORKER_FAMILIES:-python,node,golang,rust,eclipse-temurin,mcr.microsoft.com/dotnet/sdk,ruby,php,gcc,ubuntu,debian,alpine}
      - STACKPILOT_AGENT_DOCKER_PROVISIONING=${STACKPILOT_AGENT_DOCKER_PROVISIONING:-true}
      - STACKPILOT_AGENT_INSTANCE_ROOT=/app/uploads/agent-instances
      - STACKPILOT_AGENT_INSTANCE_MAX_TOTAL=${STACKPILOT_AGENT_INSTANCE_MAX_TOTAL:-8}
      - STACKPILOT_AGENT_INSTANCE_MAX_PER_RUN=${STACKPILOT_AGENT_INSTANCE_MAX_PER_RUN:-3}
      - STACKPILOT_AGENT_INSTANCE_TOTAL_MEMORY_MB=${STACKPILOT_AGENT_INSTANCE_TOTAL_MEMORY_MB:-4096}
      - STACKPILOT_AGENT_INSTANCE_TOTAL_CPUS=${STACKPILOT_AGENT_INSTANCE_TOTAL_CPUS:-4}
      - STACKPILOT_AGENT_INSTANCE_MAX_TTL_SECONDS=${STACKPILOT_AGENT_INSTANCE_MAX_TTL_SECONDS:-3600}
      - STACKPILOT_AGENT_INSTANCE_MAX_MEMORY_MB=${STACKPILOT_AGENT_INSTANCE_MAX_MEMORY_MB:-4096}
      - STACKPILOT_AGENT_INSTANCE_MAX_CPUS=${STACKPILOT_AGENT_INSTANCE_MAX_CPUS:-8}
      - STACKPILOT_DOCKER_CAPABILITIES=${STACKPILOT_DOCKER_CAPABILITIES:-}
      - STACKPILOT_AGENT_LOCAL_WORKERS=${STACKPILOT_AGENT_LOCAL_WORKERS:-false}
      - SOURCE_ARTIFACT_DIR=/app/uploads/source-artifacts
      - BUILD_MAX_LOG_BYTES=${BUILD_MAX_LOG_BYTES:-200000}
      - BUILD_CLONE_TIMEOUT_SECONDS=${BUILD_CLONE_TIMEOUT_SECONDS:-300}
      - BUILD_COMMAND_TIMEOUT_SECONDS=${BUILD_COMMAND_TIMEOUT_SECONDS:-3600}
      - BUILD_DOCKER_MEMORY=${BUILD_DOCKER_MEMORY:-1g}
      - STACKPILOT_CI_NO_CHECKS_GRACE_SECONDS=${STACKPILOT_CI_NO_CHECKS_GRACE_SECONDS:-30}
      - STACKPILOT_REQUIRED_CI_POLICY=${STACKPILOT_REQUIRED_CI_POLICY:-}
      - LOCAL_SOURCE_ROOTS=${LOCAL_SOURCE_ROOTS:-/app/local-projects}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-}
      - GITHUB_OAUTH_REDIRECT_URL=${GITHUB_OAUTH_REDIRECT_URL:-}
      - GITHUB_FORCE_REDIRECT_URI=${GITHUB_FORCE_REDIRECT_URI:-false}
      - GITHUB_APP_WEBHOOK_MODE=${GITHUB_APP_WEBHOOK_MODE:-false}
      - GITHUB_APP_NAME=${GITHUB_APP_NAME:-StackPilot}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID:-}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET:-}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH:-}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-stackpilot-apps}
      - K8S_SERVICE_TYPE=${K8S_SERVICE_TYPE:-NodePort}
      - K8S_EXPOSURE_MODE=${K8S_EXPOSURE_MODE:-ingress}
      - K8S_NODE_HOST=${K8S_NODE_HOST:-localhost}
      - K8S_BASE_DOMAIN=${K8S_BASE_DOMAIN:-}
      - K8S_RUNTIME_SCHEME=${K8S_RUNTIME_SCHEME:-https}
      - K8S_INGRESS_CLASS=${K8S_INGRESS_CLASS:-nginx}
      - K8S_CERT_CLUSTER_ISSUER=${K8S_CERT_CLUSTER_ISSUER:-letsencrypt-prod}
      - K8S_INGRESS_TLS_SECRET=${K8S_INGRESS_TLS_SECRET:-}
      - K8S_INGRESS_ANNOTATIONS_JSON=${K8S_INGRESS_ANNOTATIONS_JSON:-}
      - REMOTE_K8S_BASE_DOMAIN=${REMOTE_K8S_BASE_DOMAIN:-}
      - REMOTE_K8S_INGRESS_CLASS=${REMOTE_K8S_INGRESS_CLASS:-auto}
      - REMOTE_K8S_CERT_CLUSTER_ISSUER=${REMOTE_K8S_CERT_CLUSTER_ISSUER:-letsencrypt-prod}
      - REMOTE_K8S_CERT_MANAGER_VERSION=${REMOTE_K8S_CERT_MANAGER_VERSION:-v1.15.3}
      - K8S_NAMESPACE_PREFIX=${K8S_NAMESPACE_PREFIX:-}
      - K8S_IMAGE_PULL_SECRET=${K8S_IMAGE_PULL_SECRET:-}
      - K8S_SERVICE_ACCOUNT_NAME=${K8S_SERVICE_ACCOUNT_NAME:-}
      - K8S_ENABLE_PDB=${K8S_ENABLE_PDB:-true}
      - K8S_ENABLE_HPA=${K8S_ENABLE_HPA:-false}
      - K8S_HPA_MIN_REPLICAS=${K8S_HPA_MIN_REPLICAS:-1}
      - K8S_HPA_MAX_REPLICAS=${K8S_HPA_MAX_REPLICAS:-3}
      - K8S_HPA_CPU_UTILIZATION=${K8S_HPA_CPU_UTILIZATION:-70}
      - K8S_MAX_REPLICAS=${K8S_MAX_REPLICAS:-10}
      - K8S_CPU_REQUEST=${K8S_CPU_REQUEST:-100m}
      - K8S_MEMORY_REQUEST=${K8S_MEMORY_REQUEST:-128Mi}
      - K8S_CPU_LIMIT=${K8S_CPU_LIMIT:-500m}
      - K8S_MEMORY_LIMIT=${K8S_MEMORY_LIMIT:-512Mi}
      - K8S_PROBE_PATH=${K8S_PROBE_PATH:-/}
      - K8S_READINESS_INITIAL_DELAY_SECONDS=${K8S_READINESS_INITIAL_DELAY_SECONDS:-5}
      - K8S_LIVENESS_INITIAL_DELAY_SECONDS=${K8S_LIVENESS_INITIAL_DELAY_SECONDS:-15}
