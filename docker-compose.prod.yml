      - STACKPILOT_AI_SERVICE_TOKEN=${STACKPILOT_AI_SERVICE_TOKEN:-}
      - STACKPILOT_AI_PROVIDER=${STACKPILOT_AI_PROVIDER:-nvidia_nim}
      - STACKPILOT_AI_MODEL=${STACKPILOT_AI_MODEL:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_NIM_MODEL=${NVIDIA_NIM_MODEL:-z-ai/glm-5.3-flash}
      - NVIDIA_NIM_FAST_MODEL=${NVIDIA_NIM_FAST_MODEL:-z-ai/glm-5.3-flash}
      - NVIDIA_NIM_THINKING_MODEL=${NVIDIA_NIM_THINKING_MODEL:-meta/llama-3.1-70b-instruct}
      - NVIDIA_NIM_ALLOWED_MODELS=${NVIDIA_NIM_ALLOWED_MODELS:-}
      - NVIDIA_NIM_DISCOVER_MODELS=${NVIDIA_NIM_DISCOVER_MODELS:-true}
      - NVIDIA_NIM_PROBE_MODELS=${NVIDIA_NIM_PROBE_MODELS:-true}
      - NVIDIA_NIM_MODEL_PROBE_LIMIT=${NVIDIA_NIM_MODEL_PROBE_LIMIT:-25}
      - NVIDIA_NIM_EMBEDDING_MODEL=${NVIDIA_NIM_EMBEDDING_MODEL:-nvidia/llama-3.2-nv-embedqa-1b-v2}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL:-}
      - OPENAI_COMPATIBLE_API_KEY=${OPENAI_COMPATIBLE_API_KEY:-}
      - OPENAI_COMPATIBLE_MODEL=${OPENAI_COMPATIBLE_MODEL:-}
      - OPENAI_COMPATIBLE_THINKING_MODEL=${OPENAI_COMPATIBLE_THINKING_MODEL:-}
      - OPENAI_COMPATIBLE_EMBEDDING_MODEL=${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-text-embedding-3-small}
      - STACKPILOT_AI_REQUEST_TIMEOUT_SECONDS=${STACKPILOT_AI_REQUEST_TIMEOUT_SECONDS:-90}
      - STACKPILOT_AI_STREAM_HEADER_TIMEOUT_SECONDS=${STACKPILOT_AI_STREAM_HEADER_TIMEOUT_SECONDS:-30}
      - STACKPILOT_AI_STREAM_IDLE_TIMEOUT_SECONDS=${STACKPILOT_AI_STREAM_IDLE_TIMEOUT_SECONDS:-30}
      - STACKPILOT_AI_BROWSER_PROVIDER_TIMEOUT_SECONDS=${STACKPILOT_AI_BROWSER_PROVIDER_TIMEOUT_SECONDS:-120}
      - BROWSER_MAX_SESSIONS=${BROWSER_MAX_SESSIONS:-4}
      - BROWSER_SESSION_IDLE_SECONDS=${BROWSER_SESSION_IDLE_SECONDS:-900}
      - HOST_BROWSER_CDP_URL=${HOST_BROWSER_CDP_URL:-}
      - HOST_BROWSER_TOKEN=${HOST_BROWSER_TOKEN:-}
      - BROWSER_HOST_MEDIA_FPS=${BROWSER_HOST_MEDIA_FPS:-30}
      - BROWSER_HOST_MEDIA_BITRATE=${BROWSER_HOST_MEDIA_BITRATE:-2000000}
      - REMOTE_BROWSER_SANDBOX_URL=${REMOTE_BROWSER_SANDBOX_URL:-}
      - REMOTE_BROWSER_STREAM_HOST=${REMOTE_BROWSER_STREAM_HOST:-}
      - REMOTE_BROWSER_STREAM_PORT=${REMOTE_BROWSER_STREAM_PORT:-8099}
      - BROWSER_WEBRTC_ENABLED=${BROWSER_WEBRTC_ENABLED:-true}
      - BROWSER_RTC_ICE_SERVERS=${BROWSER_RTC_ICE_SERVERS:-[]}
      - BROWSER_RTC_ADVERTISED_IP=${BROWSER_RTC_ADVERTISED_IP:-}
      - BROWSER_RTC_UDP_MIN=8011
      - BROWSER_RTC_UDP_MAX=8026
      - STACKPILOT_AI_TEST_MAX_ACTIONS=${STACKPILOT_AI_TEST_MAX_ACTIONS:-120}
      - STACKPILOT_AI_TEST_MAX_SECONDS=${STACKPILOT_AI_TEST_MAX_SECONDS:-180}
      - STACKPILOT_AI_TEST_DEEP_MAX_ACTIONS=${STACKPILOT_AI_TEST_DEEP_MAX_ACTIONS:-360}
      - STACKPILOT_AI_TEST_DEEP_MAX_SECONDS=${STACKPILOT_AI_TEST_DEEP_MAX_SECONDS:-600}
      - STACKPILOT_AI_MAX_TEXT_BYTES=${STACKPILOT_AI_MAX_TEXT_BYTES:-24000}
      - STACKPILOT_AI_EMBEDDING_DIMENSIONS=${STACKPILOT_AI_EMBEDDING_DIMENSIONS:-384}
      - STACKPILOT_AI_EMBEDDING_FALLBACK=${STACKPILOT_AI_EMBEDDING_FALLBACK:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      browser-state-init:
        condition: service_completed_successfully
      agent-workspace-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      browser-sandbox:
        condition: service_started
        required: false
    volumes:
      - agent_run_state:/app/browser-state
      - ./uploads:/app/uploads:ro
      - ${STACKPILOT_LOCAL_PROJECTS_DIR:-./local-projects}:/app/local-projects:ro
      - agent_workspaces:/app/agent-workspaces
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  browser-sandbox:
    networks: [default, runtime]
    profiles: ["browser", "full"]
    build:
      context: ./browser-sandbox
    restart: unless-stopped
    logging: *stackpilot-logging
    shm_size: '1gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DISPLAY=:99
      - STREAM_FPS=${STREAM_FPS:-30}
      - STREAM_MAX_FPS=${STREAM_MAX_FPS:-60}
      - STREAM_IDLE_FPS=${STREAM_IDLE_FPS:-8}
      - STREAM_ENCODER=${STREAM_ENCODER:-auto}
      - BROWSER_RENDERER=${BROWSER_RENDERER:-auto}
      - STREAM_WIDTH=1280
      - STREAM_HEIGHT=720
      - STREAM_BITRATE=2500k
    expose: ["9222", "8099"]
    deploy:
      resources:
        limits:
          memory: 4096M

  searxng:
    image: searxng/searxng:latest
    container_name: stackpilot-searxng
    restart: unless-stopped
    profiles: ["search", "full"]
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/
    volumes:
      - ./searxng:/etc/searxng:ro

  # ─── Next.js Frontend (Prebuilt Platform UI) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AI_SERVICE_WS_URL: wss://${STACKPILOT_DOMAIN:?Set STACKPILOT_DOMAIN in .env}:${STACKPILOT_HTTPS_PORT:-9443}
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-wss://${STACKPILOT_DOMAIN:?Set STACKPILOT_DOMAIN in .env}:${STACKPILOT_HTTPS_PORT:-9443}}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
    restart: unless-stopped
    logging: *stackpilot-logging
    environment:
      - NODE_ENV=production
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_GITHUB_CLIENT_ID=${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
    expose:
      - "3000"
    depends_on:
      - backend

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    logging: *stackpilot-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.external-url=${PROMETHEUS_PUBLIC_URL:-https://${STACKPILOT_DOMAIN}:${STACKPILOT_HTTPS_PORT:-9443}/prometheus}"
      - "--web.route-prefix=/prometheus"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.4.2
    restart: unless-stopped
    logging: *stackpilot-logging
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.19.0
    restart: unless-stopped
    logging: *stackpilot-logging
    command: ["run", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    logging: *stackpilot-logging
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:11.5.2
    restart: unless-stopped
    logging: *stackpilot-logging
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=${GRAFANA_PUBLIC_URL:-http://${STACKPILOT_DOMAIN:?Set STACKPILOT_DOMAIN in .env}:${STACKPILOT_HTTP_PORT:-8081}/grafana}/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

networks:
  runtime:
    name: ${STACKPILOT_RUNTIME_NETWORK:-stackpilot-runtime}

volumes:
  agent_workspaces:
  alloy_data:
  agent_run_state:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  loki_data:
  grafana_data:
