name: stackpilot

x-stackpilot-logging: &stackpilot-logging
  driver: json-file
  options:
    max-size: ${STACKPILOT_LOG_MAX_SIZE:-10m}
    max-file: ${STACKPILOT_LOG_MAX_FILE:-5}

services:
  # ─── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stackpilot-postgres
    restart: unless-stopped
    logging: *stackpilot-logging
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=25
      - -c
      - random_page_cost=1.1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── C++ Backend ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stackpilot-redis
    restart: unless-stopped
    logging: *stackpilot-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The backend runs as uid 10001, but ./uploads is a host bind mount whose
  # subdirectories were historically created by a root container. Fix ownership
  # once, as root, before the backend starts — otherwise build workspaces fail
  # with "Unable to prepare generated application build workspace".
  uploads-init:
    image: alpine:3
    container_name: stackpilot-uploads-init
    user: "0:0"
    command: sh -c "mkdir -p /work/builds /work/source-artifacts && chown 10001:10001 /work /work/builds /work/source-artifacts && chmod 777 /work /work/builds /work/source-artifacts"
    volumes:
      - ./uploads:/work
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        STACKPILOT_BACKEND_BUILD_PARALLELISM: ${STACKPILOT_BACKEND_BUILD_PARALLELISM:-auto}
    container_name: stackpilot-backend
    restart: unless-stopped
    logging: *stackpilot-logging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - STACKPILOT_REDIS_QUEUE=${STACKPILOT_REDIS_QUEUE:-stackpilot:jobs:deployment}
      - STACKPILOT_JOB_WORKERS=${STACKPILOT_JOB_WORKERS:-2}
      - STACKPILOT_BLOCKING_WORKERS=${STACKPILOT_BLOCKING_WORKERS:-4}
      - STACKPILOT_JOB_MAX_ATTEMPTS=${STACKPILOT_JOB_MAX_ATTEMPTS:-3}
      - PROMETHEUS_PUBLIC_URL=${PROMETHEUS_PUBLIC_URL:-http://localhost:9090}
      - GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-http://localhost:3001}
      - LOKI_PUBLIC_URL=${LOKI_PUBLIC_URL:-http://localhost:3001/explore}
      - STACKPILOT_METRICS_BEARER_TOKEN=${STACKPILOT_METRICS_BEARER_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRY_SECONDS=${JWT_EXPIRY_SECONDS:-3600}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:?Set CORS_ALLOWED_ORIGIN in .env}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://localhost:8090}
      - STACKPILOT_AUTH_REGISTRATION_MODE=${STACKPILOT_AUTH_REGISTRATION_MODE:-open}
      - STACKPILOT_AUTH_INVITE_CODE=${STACKPILOT_AUTH_INVITE_CODE:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-StackPilot Platform}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-}
      - BUILD_WORKSPACE_DIR=/app/uploads/builds
      - SOURCE_ARTIFACT_DIR=/app/uploads/source-artifacts
      - BUILD_MAX_LOG_BYTES=${BUILD_MAX_LOG_BYTES:-200000}
      - BUILD_CLONE_TIMEOUT_SECONDS=${BUILD_CLONE_TIMEOUT_SECONDS:-300}
      - BUILD_COMMAND_TIMEOUT_SECONDS=${BUILD_COMMAND_TIMEOUT_SECONDS:-3600}
      - BUILD_DOCKER_MEMORY=${BUILD_DOCKER_MEMORY:-512m}
      - STACKPILOT_CI_NO_CHECKS_GRACE_SECONDS=${STACKPILOT_CI_NO_CHECKS_GRACE_SECONDS:-30}
      - LOCAL_SOURCE_ROOTS=${LOCAL_SOURCE_ROOTS:-/app/local-projects}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-}
      - GITHUB_OAUTH_REDIRECT_URL=${GITHUB_OAUTH_REDIRECT_URL:-}
      - GITHUB_FORCE_REDIRECT_URI=${GITHUB_FORCE_REDIRECT_URI:-false}
      - GITHUB_APP_WEBHOOK_MODE=${GITHUB_APP_WEBHOOK_MODE:-false}
      - GITHUB_APP_NAME=${GITHUB_APP_NAME:-StackPilot}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID:-}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET:-}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH:-}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-stackpilot-apps}
      - K8S_SERVICE_TYPE=${K8S_SERVICE_TYPE:-NodePort}
      - K8S_EXPOSURE_MODE=${K8S_EXPOSURE_MODE:-service}
      - K8S_NODE_HOST=${K8S_NODE_HOST:-localhost}
      - K8S_BASE_DOMAIN=${K8S_BASE_DOMAIN:-}
      - K8S_RUNTIME_SCHEME=${K8S_RUNTIME_SCHEME:-http}
      - K8S_INGRESS_CLASS=${K8S_INGRESS_CLASS:-}
      - K8S_CERT_CLUSTER_ISSUER=${K8S_CERT_CLUSTER_ISSUER:-}
      - K8S_INGRESS_TLS_SECRET=${K8S_INGRESS_TLS_SECRET:-}
      - K8S_INGRESS_ANNOTATIONS_JSON=${K8S_INGRESS_ANNOTATIONS_JSON:-}
      - REMOTE_K8S_BASE_DOMAIN=${REMOTE_K8S_BASE_DOMAIN:-}
      - REMOTE_K8S_INGRESS_CLASS=${REMOTE_K8S_INGRESS_CLASS:-}
      - REMOTE_K8S_CERT_CLUSTER_ISSUER=${REMOTE_K8S_CERT_CLUSTER_ISSUER:-}
      - REMOTE_K8S_CERT_MANAGER_VERSION=${REMOTE_K8S_CERT_MANAGER_VERSION:-v1.15.3}
      - K8S_NAMESPACE_PREFIX=${K8S_NAMESPACE_PREFIX:-}
      - K8S_IMAGE_PULL_SECRET=${K8S_IMAGE_PULL_SECRET:-}
      - K8S_SERVICE_ACCOUNT_NAME=${K8S_SERVICE_ACCOUNT_NAME:-}
      - K8S_ENABLE_PDB=${K8S_ENABLE_PDB:-true}
      - K8S_ENABLE_HPA=${K8S_ENABLE_HPA:-false}
      - K8S_HPA_MIN_REPLICAS=${K8S_HPA_MIN_REPLICAS:-1}
      - K8S_HPA_MAX_REPLICAS=${K8S_HPA_MAX_REPLICAS:-3}
      - K8S_HPA_CPU_UTILIZATION=${K8S_HPA_CPU_UTILIZATION:-70}
      - K8S_MAX_REPLICAS=${K8S_MAX_REPLICAS:-10}
      - K8S_CPU_REQUEST=${K8S_CPU_REQUEST:-100m}
      - K8S_MEMORY_REQUEST=${K8S_MEMORY_REQUEST:-128Mi}
      - K8S_CPU_LIMIT=${K8S_CPU_LIMIT:-500m}
      - K8S_MEMORY_LIMIT=${K8S_MEMORY_LIMIT:-512Mi}
      - K8S_PROBE_PATH=${K8S_PROBE_PATH:-/}
      - K8S_READINESS_INITIAL_DELAY_SECONDS=${K8S_READINESS_INITIAL_DELAY_SECONDS:-5}
      - K8S_LIVENESS_INITIAL_DELAY_SECONDS=${K8S_LIVENESS_INITIAL_DELAY_SECONDS:-15}
      - K8S_STARTUP_FAILURE_THRESHOLD=${K8S_STARTUP_FAILURE_THRESHOLD:-30}
      - K8S_ROLLOUT_TIMEOUT_SECONDS=${K8S_ROLLOUT_TIMEOUT_SECONDS:-180}
      - KUBECONFIG_PATH=${KUBECONFIG_PATH:-/home/stackpilot/.kube/config}
      - KUBECONFIG=/home/stackpilot/.kube/config
      - STACKPILOT_AI_ENABLED=${STACKPILOT_AI_ENABLED:-true}
      - STACKPILOT_AI_SERVICE_URL=${STACKPILOT_AI_SERVICE_URL:-http://ai-service:8010}
      - STACKPILOT_AI_SERVICE_TOKEN=${STACKPILOT_AI_SERVICE_TOKEN:-}
      - STACKPILOT_AI_PROVIDER=${STACKPILOT_AI_PROVIDER:-nvidia_nim}
      - STACKPILOT_AI_MODEL=${STACKPILOT_AI_MODEL:-}
      - STACKPILOT_AI_CONFIDENCE_THRESHOLD=${STACKPILOT_AI_CONFIDENCE_THRESHOLD:-0.72}
      - STACKPILOT_AI_RATE_LIMIT_PER_MINUTE=${STACKPILOT_AI_RATE_LIMIT_PER_MINUTE:-12}
      - STACKPILOT_AI_MAX_CONTEXT_BYTES=${STACKPILOT_AI_MAX_CONTEXT_BYTES:-32000}
      - STACKPILOT_AI_SERVICE_TIMEOUT_SECONDS=${STACKPILOT_AI_SERVICE_TIMEOUT_SECONDS:-300}
      - STACKPILOT_AI_STREAM_TIMEOUT_SECONDS=${STACKPILOT_AI_STREAM_TIMEOUT_SECONDS:-3600}
      - STACKPILOT_AI_EMBEDDING_DIMENSIONS=${STACKPILOT_AI_EMBEDDING_DIMENSIONS:-384}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_NIM_MODEL=${NVIDIA_NIM_MODEL:-meta/llama-3.2-11b-vision-instruct}
      - NVIDIA_NIM_FAST_MODEL=${NVIDIA_NIM_FAST_MODEL:-z-ai/glm-5.3-flash}
      - NVIDIA_NIM_THINKING_MODEL=${NVIDIA_NIM_THINKING_MODEL:-deepseek-ai/deepseek-v4-flash-0731}
      - NVIDIA_NIM_ALLOWED_MODELS=${NVIDIA_NIM_ALLOWED_MODELS:-}
      - NVIDIA_NIM_DISCOVER_MODELS=${NVIDIA_NIM_DISCOVER_MODELS:-true}
      - NVIDIA_NIM_PROBE_MODELS=${NVIDIA_NIM_PROBE_MODELS:-true}
      - NVIDIA_NIM_EMBEDDING_MODEL=${NVIDIA_NIM_EMBEDDING_MODEL:-nvidia/llama-3.2-nv-embedqa-1b-v2}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL:-}
      - OPENAI_COMPATIBLE_API_KEY=${OPENAI_COMPATIBLE_API_KEY:-}
      - OPENAI_COMPATIBLE_MODEL=${OPENAI_COMPATIBLE_MODEL:-}
      - OPENAI_COMPATIBLE_THINKING_MODEL=${OPENAI_COMPATIBLE_THINKING_MODEL:-}
      - OPENAI_COMPATIBLE_EMBEDDING_MODEL=${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The backend now runs as uid 10001 (see Dockerfile). The mounted docker
    # socket is root:root mode 660 on Docker Desktop, with no `docker` group to
    # join, so supplementary group 0 is required for the ~141 docker shell-outs.
    # This grants socket access only — the process is still not uid 0.
    group_add:
      - "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./uploads:/app/uploads
      - ${STACKPILOT_LOCAL_PROJECTS_DIR:-./local-projects}:/app/local-projects:ro
      - ${USERPROFILE}/.kube/config:/home/stackpilot/.kube/config:ro
      - ${USERPROFILE}/.kube/config:/root/.kube/config:ro
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-service:
    init: true
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: stackpilot-ai-service
    restart: unless-stopped
    logging: *stackpilot-logging
    profiles: ["ai", "full"]
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - BACKEND_INTERNAL_URL=http://backend:8090
      - STACKPILOT_AI_SERVICE_TOKEN=${STACKPILOT_AI_SERVICE_TOKEN:-}
      - STACKPILOT_AI_PROVIDER=${STACKPILOT_AI_PROVIDER:-nvidia_nim}
      - STACKPILOT_AI_MODEL=${STACKPILOT_AI_MODEL:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_NIM_MODEL=${NVIDIA_NIM_MODEL:-openai/gpt-oss-20b}
      - NVIDIA_NIM_FAST_MODEL=${NVIDIA_NIM_FAST_MODEL:-openai/gpt-oss-20b}
      - NVIDIA_NIM_THINKING_MODEL=${NVIDIA_NIM_THINKING_MODEL:-openai/gpt-oss-20b}
      - NVIDIA_NIM_ALLOWED_MODELS=${NVIDIA_NIM_ALLOWED_MODELS:-}
      - NVIDIA_NIM_DISCOVER_MODELS=${NVIDIA_NIM_DISCOVER_MODELS:-true}
      - NVIDIA_NIM_PROBE_MODELS=${NVIDIA_NIM_PROBE_MODELS:-true}
      - NVIDIA_NIM_MODEL_PROBE_LIMIT=${NVIDIA_NIM_MODEL_PROBE_LIMIT:-25}
      - NVIDIA_NIM_EMBEDDING_MODEL=${NVIDIA_NIM_EMBEDDING_MODEL:-nvidia/llama-3.2-nv-embedqa-1b-v2}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL:-}
      - OPENAI_COMPATIBLE_API_KEY=${OPENAI_COMPATIBLE_API_KEY:-}
      - OPENAI_COMPATIBLE_MODEL=${OPENAI_COMPATIBLE_MODEL:-}
      - OPENAI_COMPATIBLE_THINKING_MODEL=${OPENAI_COMPATIBLE_THINKING_MODEL:-}
      - OPENAI_COMPATIBLE_EMBEDDING_MODEL=${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-text-embedding-3-small}
      - STACKPILOT_AI_REQUEST_TIMEOUT_SECONDS=${STACKPILOT_AI_REQUEST_TIMEOUT_SECONDS:-300}
      - STACKPILOT_AI_MAX_TEXT_BYTES=${STACKPILOT_AI_MAX_TEXT_BYTES:-24000}
      - STACKPILOT_AI_EMBEDDING_DIMENSIONS=${STACKPILOT_AI_EMBEDDING_DIMENSIONS:-384}
      - STACKPILOT_AI_EMBEDDING_FALLBACK=${STACKPILOT_AI_EMBEDDING_FALLBACK:-true}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - BROWSER_SANDBOX_URL=${BROWSER_SANDBOX_URL:-http://browser-sandbox:9222}
      - BROWSER_STREAM_HOST=${BROWSER_STREAM_HOST:-browser-sandbox}
      - BROWSER_STREAM_PORT=${BROWSER_STREAM_PORT:-8099}
    ports:
      - "${STACKPILOT_AI_SERVICE_PORT:-8010}:8010"
    volumes:
      - ./ai-service/app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  browser-sandbox:
    build:
      context: ./browser-sandbox
      dockerfile: Dockerfile
    image: stackpilot/browser-sandbox:latest
    container_name: stackpilot-browser-sandbox
    restart: unless-stopped
    profiles: ["browser", "full"]
    shm_size: '4gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DISPLAY=:99
      - STREAM_FPS=30
      - STREAM_WIDTH=1280
      - STREAM_HEIGHT=720
      - STREAM_BITRATE=2000k
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 512M
    ports:
      - "127.0.0.1:9222:9222"
      - "127.0.0.1:8099:8099"
    volumes:
      - ./browser-sandbox/entrypoint.sh:/entrypoint.sh
      - ./browser-sandbox/streamer.py:/usr/local/bin/streamer.py

  searxng:
    image: searxng/searxng:latest
    container_name: stackpilot-searxng
    restart: unless-stopped
    profiles: ["search", "full"]
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/
    volumes:
      - ./searxng:/etc/searxng:ro

  # ─── Next.js Frontend (Live Hot-Reloading) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: stackpilot-frontend:dev
    container_name: stackpilot-frontend
    restart: unless-stopped
    logging: *stackpilot-logging
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 256M
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8090/api/v1}
      - NEXT_PUBLIC_WS_BASE_URL=${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8090}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_GITHUB_CLIENT_ID=${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=15 http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: stackpilot-prometheus
    restart: unless-stopped
    logging: *stackpilot-logging
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  loki:
    image: grafana/loki:3.4.2
    container_name: stackpilot-loki
    restart: unless-stopped
    logging: *stackpilot-logging
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 256M
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.4.2
    container_name: stackpilot-promtail
    restart: unless-stopped
    logging: *stackpilot-logging
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 128M
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: stackpilot-cadvisor
    restart: unless-stopped
    logging: *stackpilot-logging
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 128M
    privileged: true
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: stackpilot-grafana
    restart: unless-stopped
    logging: *stackpilot-logging
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
