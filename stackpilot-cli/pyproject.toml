[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stackpilot-cli"
version = "1.1.0"
description = "StackPilot setup, deployments, authenticated AI workflows and container management"
readme = "README.md"
authors = [{ name = "StackPilot Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "websockets>=12.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0"
]

[project.scripts]
stackpilot = "stackpilot_cli.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["stackpilot_cli*"]
