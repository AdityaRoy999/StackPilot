name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

# A new push to the same branch supersedes the run in flight. The integration
# job boots the whole stack, so overlapping runs are expensive and pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-agent:
    name: AI agent — browser testing regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r ai-service/requirements.txt
      - name: Run deterministic agent tests
        env:
          PYTHONPATH: ai-service
        run: python -m unittest discover -s ai-service/tests -p 'test_*.py' -v
      - name: Run deployment contract regressions
        run: python -m unittest discover -s tests/deployment -v
      - name: Run native worker boundary and recovery tests
        run: python -m unittest discover -s native-worker -p 'test_*.py' -v

  frontend:
    name: Frontend — lint, unit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint || true
      - run: npm test
      - run: npm run build

  backend-unit:
    name: Backend — C++ unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The unit-tests stage builds on top of `builder`, so this warms the same
      # layer cache the runtime image uses.
      - name: Build unit test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unit-tests
          load: true
          tags: stackpilot-unit-tests:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run unit tests
        run: docker run --rm stackpilot-unit-tests:ci

  config:
    name: Compose config validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate a throwaway .env
        run: bash .github/scripts/write-ci-env.sh
      # Catches the class of mistake where an env var lands in the wrong
      # service block: `config` resolves the merged, interpolated result, so a
      # variable defined under the wrong service shows up here and nowhere else.
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet

  integration:
    name: Integration — full stack
    runs-on: ubuntu-latest
    # 26 checks against a running stack: auth, SSRF guard, MCP scopes, secret
    # confidentiality, migration ledger. Slowest job, so it does not gate the
    # faster ones — they all run in parallel.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate a throwaway .env
        run: bash .github/scripts/write-ci-env.sh

      - name: Build and start the stack
        # Only the services the suite exercises. Grafana, Loki, Prometheus and
        # cAdvisor are validated by the config job and would otherwise add
        # several minutes of pulls to every run.
        run: |
          mkdir -p local-projects
          docker compose up -d --build postgres redis backend ai-service frontend browser-sandbox runtime-gateway

      - name: Wait for backend and ai-service
        # Both must answer before the suite runs. Polling rather than a fixed
        # sleep: an earlier local run reported the ai-service as broken purely
        # because it was probed during its warmup.
        run: |
          wait_for() {
            for attempt in $(seq 1 60); do
              if curl -fsS "$2" >/dev/null 2>&1; then
                echo "$1 healthy after ${attempt} attempt(s)"
                return 0
              fi
              sleep 5
            done
            echo "$1 never became healthy ($2)"
            return 1
          }
          ok=0
          wait_for backend    http://127.0.0.1:8090/api/v1/health || ok=1
          wait_for ai-service http://127.0.0.1:8010/readyz        || ok=1
          wait_for browser    http://127.0.0.1:9222/json/version  || ok=1
          # The frontend is slowest to come up and the suite probes it, so it
          # has to be waited on too — otherwise the liveness check races the
          # Next.js boot and fails with a connection refused.
          wait_for frontend   http://127.0.0.1:3000/              || ok=1
          if [ "$ok" -ne 0 ]; then
            docker compose ps
            docker compose logs --tail=200
            exit 1
          fi

      - name: Run agent tests against a disposable Chromium fixture
        run: |
          docker compose cp ai-service/tests/. ai-service:/tmp/agent-qa-tests
          docker compose cp sql/migrations/. ai-service:/tmp/agent-qa-migrations
          docker compose exec -T -e STACKPILOT_TEST_MIGRATIONS=/tmp/agent-qa-migrations -e AI_BROWSER_LIVE_TESTS=1 ai-service python -m unittest discover -s /tmp/agent-qa-tests -p 'test_*.py' -v

      - name: Run integration suite
        run: python tests/integration/test_platform.py

      - name: Verify runtime outcomes against real Chromium
        run: |
          docker compose cp tests/integration/runtime_render_smoke.py ai-service:/tmp/runtime_render_smoke.py
          docker compose exec -T -e PYTHONPATH=/app ai-service python /tmp/runtime_render_smoke.py

      - name: Qualify release, rollback, credentials and resource cleanup
        run: python tests/integration/release_pipeline_smoke.py

      - name: Qualify interactive consoles, finite jobs and built packages
        run: python tests/integration/repository_delivery_smoke.py

      - name: Qualify incomplete repository completion and release gates
        run: python tests/integration/completion_repository_smoke.py

      - name: Qualify task-owned Ubuntu, Debian and Alpine Docker instances
        run: python tests/integration/docker_instance_smoke.py

      - name: Qualify browser ownership and preview capabilities
        run: |
          pip install websockets==15.0.1
          python tests/integration/browser_authorization_smoke.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=400

      - name: Tear down
        if: always()
        run: docker compose down -v
