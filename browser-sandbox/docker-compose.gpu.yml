name: stackpilot

services:
  browser-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: stackpilot/browser-sandbox-gpu:latest
    container_name: stackpilot-browser-sandbox
    restart: unless-stopped
    shm_size: '4gb'
    runtime: nvidia              # NVIDIA Container Toolkit required
    environment:
      - DISPLAY=:99
      - STREAM_FPS=${STREAM_FPS:-30}
      - STREAM_MAX_FPS=${STREAM_MAX_FPS:-60}
      - STREAM_IDLE_FPS=${STREAM_IDLE_FPS:-8}
      - STREAM_ENCODER=${STREAM_ENCODER:-auto}
      - STREAM_WIDTH=${STREAM_WIDTH:-1280}
      - STREAM_HEIGHT=${STREAM_HEIGHT:-720}
      - STREAM_BITRATE=${STREAM_BITRATE:-4000k}
      - BROWSER_RENDERER=${BROWSER_RENDERER:-auto}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video, compute, utility]
    ports:
      - "${STACKPILOT_BROWSER_BIND_HOST:-127.0.0.1}:9222:9222"
      - "${STACKPILOT_BROWSER_BIND_HOST:-127.0.0.1}:8099:8099"
    volumes:
      - ./streamer.py:/usr/local/bin/streamer.py
      - ./entrypoint.gpu.sh:/entrypoint.sh
