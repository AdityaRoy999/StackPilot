name: stackpilot-browser-gpu

services:
  browser-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: stackpilot/browser-sandbox-gpu:latest
    container_name: stackpilot-browser-sandbox
    restart: unless-stopped
    shm_size: '4gb'
    runtime: nvidia              # NVIDIA Container Toolkit required
    environment:
      - DISPLAY=:99
      - STREAM_FPS=${STREAM_FPS:-60}
      - STREAM_WIDTH=${STREAM_WIDTH:-1920}
      - STREAM_HEIGHT=${STREAM_HEIGHT:-1080}
      - STREAM_BITRATE=${STREAM_BITRATE:-4000k}
      - USE_NVENC=auto           # auto-detect, or set to "true"/"false"
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video, compute, utility]
    ports:
      - "0.0.0.0:9222:9222"     # CDP WebSocket (restrict in AWS Security Group)
      - "0.0.0.0:8099:8099"     # H.264 video stream (restrict in AWS Security Group)
    volumes:
      - ./streamer.gpu.py:/usr/local/bin/streamer.py
      - ./entrypoint.gpu.sh:/entrypoint.sh
