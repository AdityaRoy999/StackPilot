<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>StackPilot launch preview</title><style>
@font-face{font-family:Jakarta;src:url(public/Jakarta.ttf)}@font-face{font-family:JetBrains;src:url(public/JetBrains.ttf)}*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:14px Jakarta}main{max-width:1280px;margin:28px auto;padding:0 20px}canvas{width:100%;display:block;border-radius:16px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}button,a{background:#eee;color:#111;border:0;border-radius:8px;padding:10px 16px;font:inherit;text-decoration:none}input{width:100%;margin:18px 0}footer{display:flex;gap:12px;align-items:center;color:#aaa}audio{display:none}
</style></head><body><main><header><strong>StackPilot · launch film</strong><a href="out/stackpilot-launch.mp4">Download MP4</a></header><canvas width="1920" height="1080"></canvas><input type="range" min="0" max="47.99" step="0.0166667" value="0" aria-label="Timeline"><footer><button id="play">Play</button><span id="time">0:00 / 0:48</span><span>English · 1080p · 60 fps</span></footer><audio src="public/master.wav"></audio></main><script type="module">
import{draw}from'./js/launch.mjs';const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),range=document.querySelector('input'),audio=document.querySelector('audio');
await Promise.all([new FontFace('Jakarta','url(public/Jakarta.ttf)').load().then(f=>document.fonts.add(f)),new FontFace('JetBrains','url(public/JetBrains.ttf)').load().then(f=>document.fonts.add(f))]);
const data={images:{}};for(const name of['captions','amplitude'])try{data[name]=await fetch('public/'+name+'.json').then(r=>r.json())}catch{data[name]=[]}
for(const name of['calculator','rdp']){const img=new Image();img.src='public/'+name+'.png';await img.decode();data.images[name]=img}
window.drawFrame=t=>{draw(c,t,data);range.value=t;document.querySelector('#time').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 0:48'};window.drawFrame(0);window.ready=true;
range.oninput=()=>{audio.currentTime=+range.value;window.drawFrame(+range.value)};document.querySelector('#play').onclick=async()=>{if(audio.paused){await audio.play();document.querySelector('#play').textContent='Pause'}else{audio.pause();document.querySelector('#play').textContent='Play'}};
function tick(){if(!audio.paused)window.drawFrame(Math.min(47.99,audio.currentTime));requestAnimationFrame(tick)}tick();
</script></body></html>
