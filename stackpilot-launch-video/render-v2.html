<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0}body{background:#0a0a0a}canvas{display:block}</style></head><body><canvas id="film" width="1920" height="1080"></canvas><script type="module">
import{draw,drawCaptions,IMAGE_NAMES,motionSamples}from'./js/launch-v2.mjs';const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),off=document.createElement('canvas');off.width=1920;off.height=1080;const oc=off.getContext('2d');
await Promise.all([new FontFace('Jakarta','url(public/Jakarta.ttf)').load().then(f=>document.fonts.add(f)),new FontFace('JetBrains','url(public/JetBrains.ttf)').load().then(f=>document.fonts.add(f))]);
const data={images:{},captions:await fetch('public/captions.json').then(r=>r.json())};
for(const name of IMAGE_NAMES){const img=new Image();img.src=name==='stack-studio-v2'?'public/'+name+'.png':'public/product-v2/'+name+'.png';await img.decode();data.images[name]=img}
window.drawFrame=(t,blur=false)=>{const n=blur?motionSamples(t):1;for(let i=0;i<n;i++){draw(oc,Math.max(0,t+((i+.5)/n-.5)/120),data);c.globalAlpha=1/(i+1);c.drawImage(off,0,0)}c.globalAlpha=1;drawCaptions(c,t,data.captions)};
window.drawFrame(0);window.ready=true;
</script></body></html>
